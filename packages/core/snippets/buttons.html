<!-- Overflow Toolbar (children collapse into a dedicated [⋮] more-menu on resize) -->
<!-- The .pa-overflow wrapper is a constrained-width flex row; overflow.js
     auto-appends a dedicated [⋮] "more" trigger and walks the lowest-priority
     children into its menu when the row runs out of space. A .pa-btn-split child
     collapses as an atomic labeled group — its primary action and its own menu
     items stay together, nothing foreign mixes in; give it a high priority so it
     survives longest. Both .pa-overflow and the card-header alias
     .pa-card__actions--overflow auto-init — no JS wiring needed.
     Standalone form (any flex context): -->
<div class="pa-overflow">
  <button class="pa-btn pa-btn--primary">Save</button>
  <button class="pa-btn pa-btn--primary">Format</button>
  <button class="pa-btn pa-btn--primary">Refresh</button>
  <button class="pa-btn pa-btn--primary" data-pa-actions-priority="10">Publish</button>
  <div class="pa-btn-split" data-pa-actions-priority="20">
    <button class="pa-btn pa-btn--primary">Run</button>
    <button class="pa-btn pa-btn--primary pa-btn-split__toggle" onclick="toggleSplitMenu(event)">
      <i class="fas fa-chevron-down text-2xs pa-btn-split__chevron"></i>
    </button>
    <div class="pa-btn-split__menu">
      <div class="pa-btn-split__menu-inner">
        <button class="pa-btn-split__item">Run with options&hellip;</button>
      </div>
    </div>
  </div>
</div>

<!-- Generated DOM (overflow, collapsed). overflow.js appends ONE trigger and
     one shared menu, then walks low-priority children into it. You never
     author these classes — they're the retheming/aliasing hooks the JS emits:

       .pa-overflow__trigger        The appended [⋮] "more" button. Ships as
                                    `pa-btn pa-btn--xs pa-btn--icon-only
                                    pa-btn--secondary pa-overflow__trigger`
                                    (ghost variant via data-pa-overflow-trigger
                                    ="ghost"). The element class carries no
                                    look of its own — pure hook.
       .pa-btn-split__menu          Reused as the trigger's dropdown container
                                    (same styling as a split button's menu).
       .pa-btn-split--in-overflow   Added to a folded .pa-btn-split so it
                                    unfolds in place as an ATOMIC labeled group
                                    instead of a flat row — its base class stays
                                    so inner __menu / __item rules still match.
       .pa-btn-split__group-label   The section heading the JS inserts above the
                                    folded split button's options, keeping them
                                    attached to their own label.

     <button class="pa-btn pa-btn--xs pa-btn--icon-only pa-btn--secondary
                    pa-overflow__trigger">⋮</button>
     <div class="pa-btn-split__menu">
       <div class="pa-btn-split__menu-inner">
         <button class="pa-btn-split__item">Publish</button>       <!-- plain fold -->
         <div class="pa-btn-split pa-btn-split--in-overflow">      <!-- atomic group -->
           <div class="pa-btn-split__group-label">Run</div>
           <button class="pa-btn-split__item">Run</button>
           <button class="pa-btn-split__item">Run with options…</button>
         </div>
       </div>
     </div>
-->

<!-- In a card header, use the card-flavored alias .pa-card__actions--overflow on
     the .pa-card__actions slot itself — the buttons and split button are its
     direct children (no inner wrapper). It auto-inits like a standalone
     .pa-overflow, appending its own [⋮] more-menu, and the header title yields
     before the actions collapse. -->
<div class="pa-card">
  <div class="pa-card__header">
    <h3>Team Members</h3>
    <div class="pa-card__actions pa-card__actions--overflow">
      <button class="pa-btn pa-btn--secondary">Search</button>
      <button class="pa-btn pa-btn--secondary">Filter</button>
      <div class="pa-btn-split" data-pa-actions-priority="20">
        <button class="pa-btn pa-btn--primary">Add user</button>
        <button class="pa-btn pa-btn--primary pa-btn-split__toggle" onclick="toggleSplitMenu(event)">
          <i class="fas fa-chevron-down text-2xs pa-btn-split__chevron"></i>
        </button>
        <div class="pa-btn-split__menu">
          <div class="pa-btn-split__menu-inner">
            <button class="pa-btn-split__item">Add user with role&hellip;</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="pa-card__body">Card content.</div>
</div>

data-ripple / data-loading-demo are DEMO-wiring attributes picked up by

-->


<!-- ================================
     COMPONENT REFERENCE
     ================================ -->

<!--
BUTTON CLASSES:
- .pa-btn             Base button; an inline-flex row (align-items: center,
                      justify-content: center, gap: $spacing-sm) that CENTRES
                      its content, $btn-height-base, $font-size-sm, medium
                      weight. One layout model for text-only, icon+label, and
                      icon-only buttons alike.

COLOUR VARIANTS (solid):
- .pa-btn--primary / --secondary / --success / --warning / --danger
  / --info / --light / --dark

OUTLINE VARIANTS (transparent bg, fills on hover):
- .pa-btn--outline-primary / --outline-secondary / --outline-success
  / --outline-warning / --outline-danger / --outline-info
  (No --outline-light / --outline-dark — SCSS doesn't define them.)

THEME COLOUR SLOT VARIANTS (1-9):
- .pa-btn--color-{1..9}            filled theme slot
- .pa-btn--outline-color-{1..9}    outline theme slot

SIZES:
- .pa-btn--xs / --sm / (default) / --lg / --xl
  Each size adjusts height, padding, and font-size from the $btn-*
  scale. Size classes compose with every variant.

STATES:
- :disabled attribute     50% opacity, not-allowed cursor, no transform
                          (opt-in disable state — no class needed)
- .pa-btn--loading        hides text (text-fill transparent) and
                          positions a .pa-btn__spinner centred in the
                          button; keep the label text so the width
                          stays the same during load.

LAYOUT MODIFIERS:
- .pa-btn--block          width: 100%; keeps the flex model (full-width CTA)
- .pa-btn--icon-only      square aspect; padding: 0; flex-centred icon
                          (size-aware — composes with --xs/--sm/--lg/--xl
                          to set the square dimension)

CONTENT ALIGNMENT (the switch for justify-content inside the button —
buttons CENTRE their content by default):
- .pa-btn--align-start    flush-start (opt-in; icon sits at the padding edge)
- .pa-btn--align-end      flush-end
- .pa-btn--align-center   centred (the default; explicit) — __label flexes to fill
- .pa-btn--align-justify  space-between (icon on one side, text on the other)

EFFECTS:
- .pa-btn--ripple            enables the CSS ripple base styles
- .pa-btn--ripple-active     added/removed by your own JS to trigger the
                             ripple expansion (see note above about
                             data-ripple which is a demo-wiring attribute)

ELEMENTS:
- .pa-btn__icon     icon container. Natural width, centred on itself; the
                    parent .pa-btn's `gap` supplies the space to the label
                    (symmetric, so a leading OR trailing icon spaces the
                    same). No fixed column or per-side margins, so the icon
                    sits at the padding edge exactly like a text label.
- .pa-btn__label    text wrapper used by --align-center to flex-fill
                    and centre its text within the button.
- .pa-btn__spinner  only used inside .pa-btn--loading; CSS handles
                    positioning + animation, no extra classes needed.

LAYOUT MODEL:
- Every .pa-btn is an inline-flex row (align-items: center,
  justify-content: center, gap: $spacing-sm) regardless of content —
  text-only, icon+label, and icon-only all lay out identically and
  CENTRE by default. Use --align-start (etc.) to change the alignment;
  an icon then sits at the padding edge, aligned with a text-only label.

BUTTON GROUP (.pa-btn-group):
- default                  inline-flex, wrap, $btn-group-gap, aligned centre
- --vertical               flex-column; aligns to flex-start by default
- --vertical --center      vertical + centre cross-axis alignment
- --vertical --end         vertical + flex-end alignment
- --vertical --stretch     vertical + stretch (all children go 100% width)
- --nowrap                 prevents wrapping on overflow
- --{sm|md|lg|xl}-vertical       responsive: column at that breakpoint
- --{sm|md|lg|xl}-horizontal     responsive: row at that breakpoint
- (Use .gap-{n} utilities to override the default gap size.)

SPLIT BUTTON (.pa-btn-split):
  Structure:
    .pa-btn-split
      .pa-btn                (primary action)
      .pa-btn.pa-btn-split__toggle
        .pa-btn-split__chevron    (optional — rotates on --open)
      .pa-btn-split__menu
        .pa-btn-split__menu-inner
          .pa-btn-split__item
          .pa-btn-split__item--danger

  State:
  - .pa-btn-split--open              set by JS; adds rotation to __chevron
  - .pa-btn-split__menu--open        set by JS; displays the menu

  Attributes:
  - data-placement="top-end"         consumed by the demo's split-button JS
                                     (Floating UI placement value)

  Item row (for menu items with a trailing action button):
    .pa-btn-split__item-row
      .pa-btn-split__item (flex: 1)
      .pa-btn (flex-shrink: 0, end-margin)
    .pa-btn-split__item-icon         optional leading icon

  Requires JS: the dropdown won't open/close or reposition without a
  script that toggles --open classes and positions __menu. The demo
  uses demo/js/split-button.js — snippet authors will need to wire
  their own equivalent.

  Inside a .pa-overflow toolbar (all JS-added — see the Generated DOM
  note above the overflow examples):
  - .pa-btn-split--in-overflow      A folded split button unfolds in place
                                    as an atomic labeled group (base class
                                    kept so inner __menu/__item still match).
  - .pa-btn-split__group-label      Section heading the JS inserts above the
                                    folded split button's own options.

OVERFLOW TOOLBAR (.pa-overflow — progressive collapse; auto-inits):
- .pa-overflow                    Constrained-width flex row; overflow.js
                                  walks lowest-priority children into a menu
                                  when it can't fit. Card alias:
                                  .pa-card__actions--overflow.
- .pa-overflow__trigger           The [⋮] "more" button the JS appends
                                  (`pa-btn pa-btn--xs pa-btn--icon-only
                                  pa-btn--secondary` by default; ghost via
                                  data-pa-overflow-trigger="ghost"). A stable
                                  retheming hook with no look of its own.
- data-pa-actions-priority="N"    Higher survives longer (lowest folds first).
- data-pa-actions-overflow-from   "end" (default) / "start" — which end folds.

STRUCTURE PATTERNS:

Icon-then-text button (most common):
<button class="pa-btn pa-btn--primary">
  <span class="pa-btn__icon"><i class="fa-solid fa-floppy-disk"></i></span>
  Save
</button>

Icon-only at XS for tables:
<button class="pa-btn pa-btn--danger pa-btn--icon-only pa-btn--xs" title="Delete">
  <i class="fa-solid fa-trash"></i>
</button>

Loading button (preserves width):
<button class="pa-btn pa-btn--primary pa-btn--loading">
  <span class="pa-btn__spinner"></span>
  Saving…
</button>

Fixed-width button with truncation:
<button class="pa-btn pa-btn--primary minwr-10 maxwr-10">
  <span class="pa-btn__icon">✓</span>
  <span class="text-truncate">Save All Changes</span>
</button>

Full-width vertical action stack:
<div class="pa-btn-group pa-btn-group--vertical pa-btn-group--stretch">
  <button class="pa-btn pa-btn--primary">Save</button>
  <button class="pa-btn pa-btn--secondary">Cancel</button>
